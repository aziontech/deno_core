name: Lint Dependencies
runs:
  using: "composite"
  steps:
    - name: Install Rust (nightly)
      uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # nightly
    - name: Lint deps
      shell: bash
      run: |
        cargo install cargo-machete --locked
        cargo machete
        cargo install cargo-udeps --locked
        cargo +nightly udeps
